<div id="container">
    <section id="options">
        <a class ="add-button" [routerLink]="['add']">Add User</a>
        <form class="search-bar">
        <input type="text" placeholder="Search users..." [value]="filterService.filterUsers()"
            (input)="filterService.filterUsers.set($any($event.target).value)">
    </form>
    </section>
    <table class="book-table">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Is Blocked</th>
            <th>Actions</th>
        </tr>
        @for(user of usersList(); track user.id){
        <tr>
            <td>{{user.firstName}}</td>
            <td>{{user.lastName}}</td>
            <td>{{user.userName}}</td>
            <td>{{user.email}}</td>
            <td>{{user.phone}}</td>
            <td>{{user.isBlocked}}</td>
            
            <td class="actions-column">
                <a class="alter-button" [routerLink]="['edit', user.id]">Edit</a>
                <button class="alter-button" (click)="deleteUser(user.id)">Delete</button>
            </td>
            }
    </table>
</div>
