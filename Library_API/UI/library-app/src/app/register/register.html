<form class="register-container" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
        <input class="input-register" type="text" placeholder="Username" formControlName="userName">
    </div>
    <div>
        <input class="input-register" type="text" placeholder="Email" formControlName="email">
    </div>
    <div>
        <input class="input-register" type="password" placeholder="Password" formControlName="password">
    </div>
    <div>
        <button class="submit" type="submit">Sign Up</button>
    </div>
</form>
