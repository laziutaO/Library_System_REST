<body>
  <main>
    <header>
      <img class="brand-logo" src="logo_smallx3.svg" alt="logo" aria-hidden="true">
      <form class="search-bar">
        <input type="text" placeholder="Search books, authors..." 
        [value]="filterService.filterText()" 
        (input)="filterService.filterText.set($any($event.target).value)">
      </form>
      <nav>
        <a routerLink="/">Home</a>
        <a routerLink="/browse">Browse</a>
        <a routerLink="/libraries">Libraries</a>
      </nav>
      <a routerLink="/user" class="profile-image">
        <img src="user_icon_small.png">
      </a>
    </header>
    <section>
      <router-outlet></router-outlet>
    </section>
  </main>
  <footer>
    <div class="descriptionDiv">
      <h3>Libra</h3>
      <p>Your digital gateway to thousands of books. Discover, read, and explore literature from around the world.
      </p>
    </div>
    <div class="descriptionDiv">
      <h3>Quick Links</h3>
      <nav>
        <a [routerLink]="'/browse'">Browse Books</a>
        <a [routerLink]="'/libraries'">Find Libraries</a>
        <a [routerLink]="'/'">My Account</a>
      </nav>
    </div>
    <div class="descriptionDiv">
      <h3>Support</h3>
      <nav>
        <a href="https://github.com/laziutaO">Help Center</a>
        <a href="https://github.com/laziutaO">Contact Us</a>
      </nav>
    </div>
  </footer>
</body>
