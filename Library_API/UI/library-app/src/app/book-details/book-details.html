<article>
    <img class="listing-img" [src]="bookData?.coverImageUrl">
    <section class="listing-discription">
        <h2 class="listing-heading">{{bookData?.title}}</h2>
        <p class="listing-discription">{{bookData?.description}}</p>
    </section>
    <section class="listing-read">
        <h2 class="section-heading">Read now</h2>
        <button class="primary" type="button">Download</button>
    </section>
</article>
