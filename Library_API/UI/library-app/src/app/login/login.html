<form class="form-container" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
        <input class="input-login" type="text" placeholder="Email" formControlName="email">
    </div>
    <div>
        <input class="input-login" type="password" placeholder="Password" formControlName="password">
    </div>
    <div>
        <button class="submit" type="submit">Log In</button>
    </div>
</form>
